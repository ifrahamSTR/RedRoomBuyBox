<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Red Room Buy Box</title>
<meta name="description" content="Airbnb red rooms and adult playrooms across US markets: where they are and how their revenue compares with each market's 1BR and 2BR homes." />
<link rel="icon" href="assets/branding/strsearch-logo.webp" type="image/webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/styles.css?v=20261028d" />
</head>
<body>

<header class="top">
  <div class="wrap top__in">
    <img class="top__logo" src="assets/branding/strsearch-logo.webp" alt="STR Search" width="36" height="36" />
    <div class="top__title">
      <h1>Red Room Buy Box</h1>
      <p>Adult-themed STRs · 1BR &amp; 2BR · USA</p>
    </div>
    <p class="top__meta" id="meta"></p>
  </div>
</header>

<main class="wrap">
  <nav class="filters" aria-label="Filters">
    <div class="chips" id="chips"></div>
    <div class="seg" id="seg" role="radiogroup" aria-label="Status"></div>
  </nav>

  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <section class="card card--map" aria-label="Map">
    <div class="card__head map-head">
      <div class="dd-tabs" id="map-tabs" role="tablist" aria-label="Map data"></div>
    </div>
    <div id="map" class="map" role="region" aria-label="Map of red room listings"></div>
  </section>

  <section class="card" aria-labelledby="pos-h">
    <div class="card__head">
      <h2 id="pos-h">Revenue position</h2>
      <div class="legend" id="chart-legend"></div>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card" aria-labelledby="tbl-h">
    <div class="card__head">
      <h2 id="tbl-h">Red rooms <span class="count" id="tbl-count"></span></h2>
    </div>
    <div class="tbl-wrap">
      <table class="tbl" id="tbl"></table>
    </div>
  </section>
  <section class="card dd" id="deep-dive" aria-labelledby="dd-h">
    <div class="card__head">
      <h2 id="dd-h">Market Deep Dive</h2>
      <div class="dd-tabs" id="dd-tabs" role="tablist" aria-label="Markets"></div>
    </div>
    <div class="dd-body" id="dd-body"></div>
  </section>

  <section class="card dd" id="inside-red-rooms" aria-labelledby="inside-h">
    <div class="card__head"><h2 id="inside-h">Inside the red rooms</h2></div>
    <div class="dd-body" id="dd-galleries"></div>
  </section>

  <section class="card dd" id="acquisition-targets" aria-labelledby="targets-h">
    <div class="card__head"><h2 id="targets-h">Acquisition targets <span class="count" id="dd-targets-count"></span></h2></div>
    <div class="dd-body dd-targets" id="dd-targets"></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap" id="foot"></div>
</footer>

<div class="tip" id="tip" role="tooltip" hidden></div>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">
  <button class="lightbox__close" id="lightbox-close" type="button" aria-label="Close">×</button>
  <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="Previous photo">‹</button>
  <figure class="lightbox__figure"><img id="lightbox-image" alt="" /><figcaption id="lightbox-caption"></figcaption></figure>
  <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="Next photo">›</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js?v=20261028a"></script>
<script src="js/util.js?v=20261026a"></script>
<script src="js/map.js?v=20261028a"></script>
<script src="js/chart.js?v=20261026b"></script>
<script src="js/table.js?v=20261026a"></script>
<script src="js/main.js?v=20261028a"></script>
<script src="js/deepdive.js?v=20261028b"></script>
<script src="js/deepdive-rockford.js?v=20261028b"></script>
<script src="js/deepdive-render.js?v=20261028b"></script>
</body>
</html>
